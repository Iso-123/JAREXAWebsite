<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080810">

  <title>JAREXA — Public Profile</title>

  <link rel="stylesheet" href="./profile.css">
</head>

<body>

  <main class="profile-container">

    <!-- PUBLIC PROFILE CARD -->
    <section
      class="public-profile"
      id="publicProfile"
      aria-label="Public profile"
    >

      <!-- LOADING / ERROR MESSAGE -->
      <p id="profileStatus" role="status">
        Loading profile...
      </p>

      <!-- PROFILE PICTURE -->
      <img
        id="publicAvatar"
        src="https://placehold.co/120x120/181825/ffffff?text=J"
        alt="Profile picture"
        width="120"
        height="120"
        hidden
      >

      <!-- USERNAME -->
      <h1 id="publicUsername"></h1>

      <!-- BIO -->
      <p id="publicBio"></p>

      <!-- SOCIAL LINKS -->
      <div
        class="social-buttons"
        id="publicSocials"
        aria-label="Social links"
      ></div>

      <!-- FAVOURITE SONG -->
      <section
        class="favourite-song"
        id="favouriteSong"
        aria-label="Favourite song"
        hidden
      >

        <div class="song-info">

          <span
            class="song-icon"
            aria-hidden="true"
          >
            ♫
          </span>

          <div>
            <strong id="songTitle"></strong>
            <p id="songArtist"></p>
          </div>

        </div>

        <a
          id="songLink"
          class="song-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          hidden
        >
          ♫ Listen to Song
        </a>

      </section>

      <!-- PROFILE VIEWS COUNTER -->
      <div
        class="profile-views"
        id="profileViews"
        aria-label="Profile views"
      >
        <span aria-hidden="true">👁</span>
        <span id="profileViewsCount">—</span>
        <span>Profile Views</span>
      </div>

    </section>

    <!-- JAREXA BRANDING -->
    <a
      class="create-profile"
      href="./index.html"
    >
      ✨ Create Your Own JAREXA Profile
    </a>

  </main>

  <!-- PUBLIC PROFILE SCRIPT -->
  <script
    type="module"
    src="./profile.js"
  ></script>

</body>
</html>
